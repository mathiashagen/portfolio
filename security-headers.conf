# Included from every block in nginx.conf that sets headers. nginx drops all
# server-level add_header lines inside a location that has its own add_header,
# so these must be repeated there, not just set once on the server.

# The main policy (script and style hashes) is a <meta> tag Astro writes into
# each page. frame-ancestors only works as a real header, so it lives here.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
